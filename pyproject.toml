[project]
name = "market-researcher"
version = "0.1.0"
description = "Find underserved Steam audiences: games with proven demand but poor execution"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mert Yılmaz" }]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Topic :: Games/Entertainment",
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.14.2",
    "rich>=15.0.0",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
mr = "market_researcher.cli:app"
# Same commands; with none, opens the web UI (so `uvx market-researcher` starts the app)
market-researcher = "market_researcher.cli:start"

[project.urls]
Homepage = "https://github.com/MertYilmaz41/market-researcher"
Issues = "https://github.com/MertYilmaz41/market-researcher/issues"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=9.2.0",
]
