name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # full tag: setup-uv publishes no @v10 since v8
      - run: uv sync
      - name: Check the web UI's JavaScript
        run: for f in src/market_researcher/web/static/*.js; do node --check "$f"; done
      - name: Install a browser for the UI tests
        run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q
      - name: Check that the built package installs and starts
        run: |
          uv build
          uvx --isolated --from dist/*.whl market-researcher --help
          uvx --isolated --from dist/*.whl mr --help
