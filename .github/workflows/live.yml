name: live endpoints

# Weekly check that Steam and SteamSpy still answer in the shape the app parses (tests/test_live.py).
# A failed scheduled run emails the repo owner, so a broken endpoint shows up before users hit it.
on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # full tag: setup-uv publishes no @v10 since v8
      - run: uv sync
      - run: uv run pytest tests/test_live.py -v
        env:
          MR_LIVE: "1"
